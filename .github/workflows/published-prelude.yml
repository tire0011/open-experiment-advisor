name: Published Prelude investigation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'

permissions:
  contents: write

jobs:
  published-prelude:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install analyzer
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Analyze source-pinned public Prelude results
        run: python scripts/refresh_prelude.py --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-prelude-investigation
          path: results/
      - name: Commit reproducible evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/latest.json results/COQA_INVESTIGATION.md results/SOURCE_PROVENANCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh published Prelude anomaly investigation'
          git push
