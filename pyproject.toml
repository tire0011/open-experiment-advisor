[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-experiment-advisor"
version = "0.3.0"
description = "Reproducible, read-only anomaly triage for model evaluation checkpoints"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Open Experiment Advisor contributors"}]
dependencies = ["pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
experiment-advisor = "experiment_advisor.cli:main"
experiment-advisor-samples = "experiment_advisor.cli_samples:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

